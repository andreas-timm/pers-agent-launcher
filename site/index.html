<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    >
    <title>Open your Pers Agent in Codex</title>
    <link rel="stylesheet" href="styles.css">
    <script src="launcher.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Pers Agent</p>
      <h1>Opening Codex…</h1>
      <p>
        If Codex does not open automatically, use the button below.
      </p>
      <a
        id="open-codex"
        class="button"
        href="codex://new?prompt=Use%20%24pers-agent-self-host%20to%20set%20up%20my%20own%20self-hosted%20Pers%20Agent%20with%20either%20the%20Android%20or%20iOS%20client.%20Resume%20saved%20progress%2C%20automate%20every%20safe%20step%2C%20give%20me%20one%20manual%20action%20at%20a%20time%2C%20verify%20it%2C%20and%20continue%20until%20I%20speak%20into%20my%20phone%20and%20hear%20the%20agent%20reply.&amp;originUrl=https%3A%2F%2Fgithub.com%2Fandreas-timm%2Fpers-agent.git"
      >
        Open Codex
      </a>
      <p class="note">
        Codex fills in the setup request. Review it and press <strong>Send</strong>
        to begin.
      </p>
    </main>
  </body>
</html>
